<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Ximenita ✨</title>
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
<style>
:root {
  --mc-gray: #C6C6C6;
  --mc-text-shadow: 2px 2px 0px #3F3F3F;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Minecraftia', sans-serif;
  background: radial-gradient(circle at top right, #1a1a2e 0%, #020205 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  color: white;
  image-rendering: pixelated;
}

/* LUNA MINIATURA REALISTA */
.moon {
  position: fixed;
  top: 20px;
  right: 20px;
  display: grid;
  grid-template-columns: repeat(8, 6px); /* Más chica */
  grid-template-rows: repeat(8, 6px);
  border: 2px solid #000;
}
.moon div { width: 6px; height: 6px; }
.w { background: #FFFFFF; } 
.g { background: #D8D8D8; } 
.s { background: #A0A0A0; } 

/* LOGRO MÁS PEQUEÑO */
.achievement {
  background: #212121;
  border: 3px solid #000;
  display: flex;
  padding: 8px;
  margin: 15px 0;
  width: 280px; /* Tamaño reducido */
}
.adv-text .title { color: #f8df14; font-size: 11px; text-shadow: var(--mc-text-shadow); }
.adv-text .desc { color: #fff; font-size: 11px; }

/* BARRAS DE VIDA Y HAMBRE (MI TOQUE EXTRA) */
.status-bars {
  display: flex;
  justify-content: space-between;
  width: 300px;
  margin-bottom: 5px;
  font-size: 14px;
}

/* CONTENEDOR GUI COMPACTO */
.gui-chest {
  background: var(--mc-gray);
  border: 3px solid #000;
  box-shadow: inset -3px -3px #555, inset 3px 3px #FFF;
  width: 320px; /* Más compacto */
  padding: 15px;
}

.slot {
  background: #8B8B8B;
  border: 3px solid #373737;
  border-top-color: #000;
  border-left-color: #000;
  margin-bottom: 15px;
  padding: 5px;
  text-align: center;
}
.item-img { width: 100%; max-width: 280px; border: 2px solid #000; }
.item-name { 
    color: #ffeb3b; 
    font-size: 18px; /* LETRAS GRANDES */
    text-shadow: 2px 2px #000;
    margin-top: 5px;
}

/* CHAT CON LETRA CLARA */
.mc-chat {
  background: rgba(0,0,0,0.8);
  padding: 12px;
  border: 2px solid #555;
  color: #FFF;
  font-size: 16px; /* LETRA GRANDE */
  line-height: 1.5;
  text-shadow: 2px 2px #000;
}

/* BOTONES */
.mc-button {
  width: 320px;
  background: #8B8B8B;
  border: 3px solid #000;
  border-top-color: #FFF; border-left-color: #FFF;
  padding: 12px;
  color: white;
  font-size: 18px; /* LETRA GRANDE */
  margin: 10px 0;
  cursor: pointer;
  text-shadow: var(--mc-text-shadow);
  font-family: 'Minecraftia', sans-serif;
}
.mc-button:active { border-top-color: #555; border-left-color: #555; padding-top: 14px; }

.sign {
  background: #7d5030;
  border: 4px solid #3d2618;
  padding: 15px;
  color: #1a0f06;
  width: 280px;
  text-align: center;
  font-size: 14px; /* LETRA GRANDE para el letrero */
  margin: 20px 0;
  box-shadow: 0 6px 0 #3d2618;
}

#modal {
  display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: #212121; border: 4px solid #fff; padding: 20px; z-index: 100; text-align: center;
  width: 280px; color: #ffff55; font-size: 20px;
}
</style>
</head>
<body>

<div class="moon">
  <div class="g"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="g"></div><div class="g"></div>
  <div class="w"></div><div class="s"></div><div class="s"></div><div class="w"></div><div class="w"></div><div class="s"></div><div class="s"></div><div class="w"></div>
  <div class="w"></div><div class="s"></div><div class="s"></div><div class="w"></div><div class="w"></div><div class="s"></div><div class="s"></div><div class="w"></div>
  <div class="w"></div><div class="w"></div><div class="w"></div><div class="s"></div><div class="s"></div><div class="w"></div><div class="w"></div><div class="w"></div>
  <div class="w"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="w"></div><div class="s"></div><div class="w"></div>
  <div class="g"></div><div class="s"></div><div class="s"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="s"></div><div class="g"></div>
  <div class="g"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="s"></div><div class="s"></div><div class="w"></div><div class="g"></div>
  <div class="g"></div><div class="g"></div><div class="g"></div><div class="w"></div><div class="w"></div><div class="g"></div><div class="g"></div><div class="g"></div>
</div>

<div class="achievement">
  <div style="font-size: 20px; margin-right: 10px;">💎</div>
  <div class="adv-text">
    <div class="title">¡Logro realizado!</div>
    <div class="desc">La niña más hermosa ✨</div>
  </div>
</div>

<button class="mc-button" onclick="playMusic()">[ REPRODUCIR SONIDO ] 🔊</button>

<div class="status-bars">
  <div style="color: #ff5555;">❤️❤️❤️❤️❤️</div>
  <div style="color: #ffaa00;">🍗🍗🍗🍗🍗</div>
</div>

<div class="gui-chest">
  <div class="slot">
    <img src="imagen2.jpg" class="item-img">
    <div class="item-name">Snoopy 🐻✨</div>
  </div>

  <div class="slot">
    <img src="imagen3.jpg" class="item-img">
    <div class="item-name">Detalle Especial 💖</div>
  </div>

  <div class="mc-chat">
    <span style="color: #55ff55;">[Ximenita]</span> Escribirte es suficiente ✨✍️. Espero que te guste 🌻🧸.
    <br><br>
    <span style="color: #aaa;">&lt;Mundo&gt;</span> Eres el tesoro más valioso 💎.
  </div>
</div>

<div class="sign">
  ESPERO QUE ALGÚN DÍA SE DÉ ALGO IGUAL TIPO MINECRAFT. ✨💖
</div>

<button class="mc-button" style="background: #3fb33f;" onclick="showModal()">💖 ¡PRESÍNAME! 💖</button>

<div id="modal">
  💎 Eres mi diamante favorito 💖
  <br><br>
  <button class="mc-button" style="width: 100px; font-size: 12px;" onclick="hideModal()">CERRAR</button>
</div>

<audio id="audio"><source src="Ximenita.mp3" type="audio/mpeg"></audio>

<script>
function playMusic() {
  document.getElementById('audio').play();
  alert("¡Música iniciada! 🎵");
}
function showModal(){ document.getElementById('modal').style.display='block'; }
function hideModal(){ document.getElementById('modal').style.display='none'; }
</script>

</body>
</html>
