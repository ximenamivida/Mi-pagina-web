<!-- BOTÓN FINAL ESTILO MINECRAFT -->
<button class="final-button" onclick="showModal()">
  💖 Presióname 💖
</button>

<!-- MODAL BONITO -->
<div id="modalMessage">
  💎 No necesito buscar diamantes, porque el tesoro más valioso eres tú 💖✨
  <br>
  <button onclick="hideModal()">Cerrar</button>
</div>

<style>
.final-button {
  background: #ffeb3b; /* amarillo Minecraft */
  color: #000;
  border: 4px solid #000;
  padding: 15px 25px;
  font-family: 'Minecraftia', sans-serif;
  font-size: 18px;
  text-shadow: 2px 2px #000;
  cursor: pointer;
  border-radius: 4px;
  transition: 0.2s;
  box-shadow: 4px 4px 0 #000;
}
.final-button:hover { background: #ffff77; }

#modalMessage {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  background: #212121;
  color: #ffeb3b;
  border: 4px solid #000;
  padding: 25px;
  font-family: 'Minecraftia', sans-serif;
  font-size: 16px;
  text-align: center;
  z-index: 1000;
  box-shadow: 4px 4px 0 #000;
  border-radius: 4px;
}
#modalMessage button {
  margin-top: 15px;
  background: #ffeb3b;
  border: 2px solid #000;
  padding: 8px 15px;
  font-family: 'Minecraftia', sans-serif;
  font-size: 14px;
  cursor: pointer;
  text-shadow: 2px 2px #000;
}
</style>

<script>
function showModal() {
  document.getElementById('modalMessage').style.display = 'block';
}
function hideModal() {
  document.getElementById('modalMessage').style.display = 'none';
}
</script>
