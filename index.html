<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo de Ximena</title>
    <link href="https://fonts.cdnfonts.com/css/minecraft-ia" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Minecraftia', sans-serif;
            color: white;
            image-rendering: pixelated;
        }

        /* 1. CARGA */
        #loading-screen {
            position: fixed; inset: 0;
            background: #2c2c2c;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000;
        }
        .mc-bar { width: 250px; height: 20px; border: 4px solid #808080; background: #000; margin-top: 15px; }
        #fill { width: 0%; height: 100%; background: #5AA514; }

        /* 2. MUNDO (Fondo con imagen de respaldo) */
        #world {
            display: none;
            position: relative;
            width: 100%; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.alphacoders.com/132/1327534.png');
            background-size: cover; background-position: center;
            background-attachment: fixed;
            padding-bottom: 180px;
        }

        /* 3. HUD (CORAZONES Y COMIDA USANDO EMOJIS COMO RESPALDO SEGURO) */
        .hud {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 350px; z-index: 9000;
            text-align: center;
        }
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 18px; }
        
        .xp-bar { width: 100%; height: 10px; background: rgba(0,0,0,0.8); border: 2px solid #000; position: relative; }
        #xp-fill { width: 0%; height: 100%; background: #7cfc00; transition: width 2s ease; }
        .xp-lvl { position: absolute; width: 100%; text-align: center; top: -20px; color: #7cfc00; text-shadow: 2px 2px #000; font-size: 18px; }

        /* 4. LIBRO ENCANTADO REALISTA */
        #book {
            display: none;
            position: fixed; top: 40%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%; max-width: 340px; height: 240px;
            background: #e6d3a8; border: 6px solid #4a3018;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), 10px 10px 0px rgba(0,0,0,0.4);
            z-index: 9500; padding: 15px; color: #303030;
            transition: transform 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49);
        }
        .book-inner { display: flex; height: 100%; gap: 10px; }
        .page { flex: 1; font-size: 11px; overflow-y: auto; line-height: 1.4; }

        /* 5. COFRE */
        .container { text-align: center; padding-top: 40px; }
        .btn-mc {
            background: #C6C6C6; border: 4px solid;
            border-color: #FFF #555 #555 #FFF;
            padding: 12px; font-family: 'Minecraftia'; cursor: pointer;
            margin-bottom: 30px; font-size: 12px;
        }
        #chest { width: 100px; cursor: pointer; display: none; margin: 20px auto; filter: drop-shadow(0 10px 10px #000); }
        .pics { display: none; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .pics img { width: 100px; height: 100px; border: 4px solid #fff; object-fit: cover; box-shadow: 4px 4px 0 #000; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div id="load-txt" style="text-shadow: 2px 2px #000;">Cargando mundo...</div>
        <div class="mc-bar"><div id="fill"></div></div>
    </div>

    <div id="world">
        <div class="container">
            <button class="btn-mc" onclick="magic()">🎵 TOCAR MÚSICA</button>
            <br>
            <img id="chest" src="https://i.imgur.com/83p73u5.png" onclick="openChest()">
            <div class="pics" id="pics">
                <img src="foto1.jpg" alt="1">
                <img src="foto2.jpg" alt="2">
                <img src="foto3.jpg" alt="3">
            </div>
        </div>

        <div id="book">
            <div class="book-inner">
                <div class="page">
                    <b style="font-size: 14px;">XIMENA:</b><br><br>
                    Este es un regalo especial del servidor. Eres la mejor jugadora de este mundo.
                </div>
                <div style="width:1px; background:rgba(0,0,0,0.1)"></div>
                <div class="page">
                    Desliza hacia abajo para abrir el cofre de suministros.<br><br>
                    <i>- Con cariño, Admin.</i>
                </div>
            </div>
        </div>

        <div class="hud">
            <div class="stats-row">
                <div id="hp"></div>
                <div id="food"></div>
            </div>
            <div class="xp-bar">
                <div class="xp-lvl">99</div>
                <div id="xp-fill"></div>
            </div>
        </div>
    </div>

    <audio id="snd" src="https://www.myinstants.com/media/sounds/minecraft-level-up.mp3"></audio>

    <script>
        // Carga forzada
        let p = 0;
        let fill = document.getElementById('fill');
        let txt = document.getElementById('load-txt');
        let frases = ["Cargando mundo...", "Generando terreno...", "Entrando al mundo de Ximena..."];

        let interval = setInterval(() => {
            p += 2;
            fill.style.width = p + "%";
            if(p > 30) txt.innerText = frases[1];
            if(p > 70) txt.innerText = frases[2];
            if(p >= 100) {
                clearInterval(interval);
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('world').style.display = 'block';
                // Generar iconos del HUD con imágenes directas de respaldo
                const hearts = document.getElementById('hp');
                const food = document.getElementById('food');
                for(let i=0; i<10; i++) {
                    hearts.innerHTML += '❤️'; // Usamos emojis para asegurar que se vea SIEMPRE
                    food.innerHTML += '🍗';
                }
            }
        }, 30);

        function magic() {
            document.getElementById('snd').play();
            document.getElementById('xp-fill').style.width = "100%";
            
            setTimeout(() => {
                let b = document.getElementById('book');
                b.style.display = 'block';
                setTimeout(() => b.style.transform = 'translate(-50%, -50%) scale(1)', 50);
            }, 800);

            setTimeout(() => {
                document.getElementById('chest').style.display = 'block';
            }, 2000);
        }

        function openChest() {
            document.getElementById('chest').style.transform = 'scale(1.2) rotate(5deg)';
            document.getElementById('pics').style.display = 'flex';
            setTimeout(() => window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'}), 300);
        }
    </script>
</body>
</html>
